<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Fondo circular de lujo: Oliva profundo aterciopelado -->
    <radialGradient id="discGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#34432C"/>
      <stop offset="65%" stop-color="#232E1D"/>
      <stop offset="100%" stop-color="#151C11"/>
    </radialGradient>

    <!-- Gradiente dorado champagne luminoso para los anillos -->
    <linearGradient id="goldRingGrad" x1="10" y1="14" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#EAC878"/>
      <stop offset="50%" stop-color="#C9A354"/>
      <stop offset="75%" stop-color="#F2D78E"/>
      <stop offset="100%" stop-color="#9E7C33"/>
    </linearGradient>

    <!-- Gradiente para el aro interior / sombra de profundidad -->
    <linearGradient id="goldRimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7E2A9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C9A354" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EED38D" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Sombra suave para dar volumen tridimensional a las alianzas -->
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#050804" flood-opacity="0.6"/>
    </filter>

    <!-- Destello de diamante -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="1" flood-color="#FFF8E7" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Medallón circular base -->
  <circle cx="32" cy="32" r="30.5" fill="url(#discGrad)"/>
  <circle cx="32" cy="32" r="29" stroke="url(#goldRimGrad)" stroke-width="1" fill="none"/>

  <!-- Alianzas de boda entrelazadas con volumen -->
  <g filter="url(#ringShadow)">
    <!-- Anillo Izquierdo (Novio / Tradicional liso) -->
    <!-- Base completa del anillo izquierdo -->
    <circle
      cx="25"
      cy="33"
      r="13"
      stroke="url(#goldRingGrad)"
      stroke-width="3.6"
      fill="none"
    />

    <!-- Anillo Derecho (Novia / Con diamante solitario en la cúspide) -->
    <!-- Dibujado completo detrás -->
    <circle
      cx="39"
      cy="31"
      r="13"
      stroke="url(#goldRingGrad)"
      stroke-width="3.6"
      fill="none"
    />

    <!-- Arco de solape tridimensional: El anillo izquierdo pasa por ENCIMA en la parte superior -->
    <path
      d="M 33 21.5 A 13 13 0 0 1 38 27.5"
      stroke="url(#goldRingGrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Arco de solape tridimensional: El anillo derecho pasa por ENCIMA en la parte inferior -->
    <path
      d="M 33 44.5 A 13 13 0 0 1 37 38.5"
      stroke="url(#goldRingGrad)"
      stroke-width="3.6"
      stroke-linecap="round"
      fill="none"
    />
  </g>

  <!-- Brillo / Diamante solitario en la cúspide del anillo de compromiso (derecho) -->
  <g transform="translate(39, 17.5)" filter="url(#sparkleGlow)">
    <!-- Gema central -->
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
    
    <!-- Destello de 4 puntas en cruz fina -->
    <path
      d="M 0 -4.5 Q 0 0 -4.5 0 Q 0 0 0 4.5 Q 0 0 4.5 0 Q 0 0 0 -4.5 Z"
      fill="#FFFCEE"
    />
  </g>

  <!-- Mini destello secundario en el anillo izquierdo -->
  <circle cx="15" cy="27" r="0.9" fill="#FFFCEE" opacity="0.85"/>
</svg>
