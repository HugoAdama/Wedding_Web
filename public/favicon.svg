<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Fondo verde oliva profundo y elegante -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D4B33"/>
      <stop offset="50%" stop-color="#2D3825"/>
      <stop offset="100%" stop-color="#1B2316"/>
    </linearGradient>

    <!-- Gradiente dorado champagne metálico -->
    <linearGradient id="goldGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="20%" stop-color="#EED596"/>
      <stop offset="50%" stop-color="#C9A961"/>
      <stop offset="80%" stop-color="#9E7F38"/>
      <stop offset="100%" stop-color="#E5C77E"/>
    </linearGradient>

    <!-- Resplandor dorado tenue -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base redondeada con esquinas suaves -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Doble filete concéntrico fino (estilo papelería de lujo) -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.6"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Corona / Estrella ornamental superior -->
  <g transform="translate(32, 13)">
    <path d="M 0 -3.2 Q 0 0 -3.2 0 Q 0 0 0 3.2 Q 0 0 3.2 0 Q 0 0 0 -3.2 Z" fill="#FFF9E8"/>
    <circle cx="0" cy="0" r="0.8" fill="#FFFFFF"/>
  </g>

  <!-- Monograma C & M -->
  <g filter="url(#goldGlow)">
    <text 
      x="32" 
      y="37.5" 
      font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
      font-size="20" 
      font-weight="600" 
      letter-spacing="0.5" 
      fill="url(#goldGrad)" 
      text-anchor="middle"
      style="font-feature-settings: 'liga', 'swsh';"
    >C &amp; M</text>
  </g>

  <!-- Corona de laurel / hojas de olivo sutil en la base -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)">
    <!-- Tallo arqueado suave -->
    <path d="M 19 46.5 C 24 50, 40 50, 45 46.5" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.8"/>
    
    <!-- Hojas izquierda -->
    <path d="M 22 47.2 C 20 46, 20.5 44, 23 45.2 C 25.5 46.4, 24 48.4, 22 47.2 Z" stroke-width="0.5" opacity="0.85"/>
    <path d="M 27 49 C 25.5 48, 26.2 46, 28.2 47.2 C 30.2 48.4, 28.5 50, 27 49 Z" stroke-width="0.5" opacity="0.85"/>

    <!-- Gema central -->
    <circle cx="32" cy="49.8" r="1.1" stroke-width="0" opacity="0.95"/>

    <!-- Hojas derecha -->
    <path d="M 42 47.2 C 44 46, 43.5 44, 41 45.2 C 38.5 46.4, 40 48.4, 42 47.2 Z" stroke-width="0.5" opacity="0.85"/>
    <path d="M 37 49 C 38.5 48, 37.8 46, 35.8 47.2 C 33.8 48.4, 35.5 50, 37 49 Z" stroke-width="0.5" opacity="0.85"/>
  </g>
</svg>
